name: Game CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feat/pozarevac-landmarks-3d"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Gameplay invariants
        run: npm run test:invariants
      - name: Production build
        run: npm run build
